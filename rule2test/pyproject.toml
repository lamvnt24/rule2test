[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rule2test"
version = "0.1.0"
description = "Insurance rule change to regression evidence hackathon base"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl==3.1.5", "defusedxml==0.7.1"]
retrieval = ["faiss-cpu==1.15.0"]


browser = ["playwright==1.62.0"]

[tool.setuptools]
packages = ["factory", "scripts"]

[project.scripts]
rule2test-demo = "scripts.run_demo:main"
